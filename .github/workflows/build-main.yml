name: Build HAPI FHIR JPA Server (Main)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
      - '.github/workflows/build-main.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: thetarho/hapi-fhir-jpaserver

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.THETARHO_GHCR_TOKEN }}

      # QEMU is what makes the arm64 leg buildable on an amd64 runner. The
      # Dockerfile pins its Maven stage to $BUILDPLATFORM, so only the small
      # distroless runtime stage is emulated — the HAPI build runs natively.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=HAPI FHIR JPA Server (Main)
            org.opencontainers.image.description=HAPI FHIR JPA Server Starter - Spring Boot application (Main)
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=main
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          # Multi-arch is REQUIRED, not cosmetic: single-box appliances ship on
          # arm64 (Mac mini, HP ZGX) and run this image under emulation today.
          # The distroless java17 runtime base and the maven/temurin build base
          # both publish arm64, and the OpenTelemetry agent is a plain jar
          # (no arch-specific artifact), so nothing needed porting. (TRDAT-589)
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

      # Fails the build if the published manifest list is missing either
      # architecture, so a regression surfaces here rather than as
      # "no matching manifest for linux/arm64/v8" on an appliance.
      - name: Verify multi-arch manifest
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main"
          echo "Inspecting $IMAGE"
          manifest=$(docker buildx imagetools inspect "$IMAGE" --raw)
          echo "$manifest" | jq -r '.manifests[]?
            | select(.platform.architecture != "unknown")
            | "  \(.platform.os)/\(.platform.architecture)"' | sort -u
          for want in linux/amd64 linux/arm64; do
            if ! echo "$manifest" | jq -e --arg w "$want" \
              '.manifests[]? | select("\(.platform.os)/\(.platform.architecture)" == $w)' >/dev/null; then
              echo "::error::$IMAGE is missing $want"
              exit 1
            fi
          done
          echo "both architectures present"

      - name: Run Trivy vulnerability scanner
        id: trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: steps.trivy.outcome == 'success'
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

      - name: Summary
        run: |
          echo "### HAPI FHIR JPA Server Build Complete! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main\`" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
